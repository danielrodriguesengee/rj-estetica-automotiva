[build]
  base    = "."
  publish = "frontend"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redireciona /api/* para as Netlify Functions
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build]
  publish = "frontend"